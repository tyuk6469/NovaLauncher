name: Bootstrap Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout NovaLauncher repository
        uses: actions/checkout@v4

      - name: Checkout pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: ZalithLauncher/ZalithLauncher2
          # Keep this revision pinned so the bootstrap build is reproducible.
          ref: 7d4f31af01d8a0f6b86e6cc59ff846c24d7bb579
          path: source
          submodules: recursive

      - name: Show build environment
        run: |
          echo "Runner: $RUNNER_OS"
          java -version
          echo "Android SDK: ${ANDROID_HOME:-not set}"
          echo "Upstream revision:"
          git -C source rev-parse HEAD
          echo "Gradle wrapper:"
          ls -l source/gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify upstream Gradle configuration
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew projects

      - name: Build arm64 debug APK
        working-directory: source
        run: ./gradlew ZalithLauncher:assembleDebug -Darch=arm64 --stacktrace

      - name: Verify APK output
        run: |
          find source/ZalithLauncher/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit | grep -q . || {
            echo "Build completed without a discoverable debug APK."
            exit 1
          }
          find source/ZalithLauncher/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -exec ls -lh {} \;

      - name: Upload bootstrap APK
        uses: actions/upload-artifact@v4
        with:
          name: upstream-bootstrap-arm64-debug
          path: source/ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
