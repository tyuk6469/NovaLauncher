name: Bootstrap Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NovaLauncher repository
        uses: actions/checkout@v4

      - name: Checkout pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: ZalithLauncher/ZalithLauncher2
          # Keep this revision pinned so the bootstrap build is reproducible.
          ref: 7d4f31af01d8a0f6b86e6cc59ff846c24d7bb579
          path: source
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build arm64 debug APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleDebug -Darch=arm64

      - name: Upload bootstrap APK
        uses: actions/upload-artifact@v4
        with:
          name: upstream-bootstrap-arm64-debug
          path: source/ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
